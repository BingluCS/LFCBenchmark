name: Validate benchmark and quality library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - name: Install Python components
        run: python -m pip install -e '.[plot,test]' -e './quality[test]'
      - name: Build and test C and C++ quality APIs
        run: |
          cmake -S quality -B "$RUNNER_TEMP/quality-build" -DLFCQUALITY_OPENMP=ON -DLFCQUALITY_FFTW=ON
          cmake --build "$RUNNER_TEMP/quality-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/quality-build" --output-on-failure
      - name: Build Python native quality library
        run: lfcquality build --openmp required --fftw required
      - name: Verify benchmark Python API
        run: |
          python -m pytest -q tests > "$RUNNER_TEMP/benchmark-tests.log" 2>&1 || {
            cat "$RUNNER_TEMP/benchmark-tests.log"
            python -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(errors="replace")[-7000:]; print("::error title=Benchmark tests failed::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$RUNNER_TEMP/benchmark-tests.log"
            exit 1
          }
          cat "$RUNNER_TEMP/benchmark-tests.log"
      - name: Verify quality Python API
        run: |
          python -m pytest -q quality/tests > "$RUNNER_TEMP/quality-tests.log" 2>&1 || {
            cat "$RUNNER_TEMP/quality-tests.log"
            python -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(errors="replace")[-7000:]; print("::error title=Quality tests failed::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$RUNNER_TEMP/quality-tests.log"
            exit 1
          }
          cat "$RUNNER_TEMP/quality-tests.log"
      - name: Rebuild published leaderboard
        run: python scripts/build_site_data.py --output "$RUNNER_TEMP/site-data"
